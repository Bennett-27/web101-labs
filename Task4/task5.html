<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding-top: 100px;
    }

    .todo-card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      color: #0f2d59;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #task-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #c0d1e5;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    #task-input:focus {
      border-color: #1a4480;
      box-shadow: 0 0 0 1px #1a4480;
    }

    #add-btn {
      background-color: #1a4480;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #add-btn:hover {
      background-color: #0f2d59;
    }

    #task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #e6eef7;
      padding: 14px 18px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #000000;
      text-align: left;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .task-item.completed {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .delete-btn {
      color: #dc3545;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 5px;
    }

    .delete-btn:hover {
      color: #a71d2a;
    }

    .counter {
      font-size: 15px;
      font-weight: 700;
      color: #0f2d59;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="todo-card">
    <h1>My Tasks</h1>
    
    <div class="input-group">
      <input type="text" id="task-input" placeholder="New task..." autocomplete="off">
      <button id="add-btn">Add</button>
    </div>

    <ul id="task-list">
      <!-- Tasks will be added here dynamically -->
    </ul>

    <div class="counter" id="task-counter">
      0 of 0 tasks done
    </div>
  </div>

  <script>
    const taskInput = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('task-list');
    const taskCounter = document.getElementById('task-counter');

    let tasks = [];

    function updateCounter() {
      const totalTasks = tasks.length;
      const completedTasks = tasks.filter(task => task.completed).length;
      taskCounter.textContent = `${completedTasks} of ${totalTasks} tasks done`;
    }

    function renderTasks() {
      taskList.innerHTML = '';
      
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        li.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-btn')) return;
          tasks[index].completed = !tasks[index].completed;
          renderTasks();
          updateCounter();
        });

        const taskText = document.createElement('span');
        taskText.textContent = task.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        
        deleteBtn.addEventListener('click', () => {
          tasks.splice(index, 1);
          renderTasks();
          updateCounter();
        });

        li.appendChild(taskText);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (text === '') return;

      tasks.push({
        text: text,
        completed: false
      });

      taskInput.value = '';
      taskInput.focus();
      
      renderTasks();
      updateCounter();
    }

    addBtn.addEventListener('click', addTask);

    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addTask();
      }
    });
  </script>
</body>
</html>
