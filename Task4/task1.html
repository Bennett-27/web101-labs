<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #eef1f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .card {
    background: #ffffff;
    width: 360px;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background-color: #d9dce3;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar svg {
    width: 40px;
    height: 40px;
    color: #b6bac4;
  }

  .name {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 800;
    color: #1c2b52;
  }

  .role {
    margin: 0 0 24px;
    font-size: 16px;
    color: #333333;
  }

  .toggle-btn {
    background-color: #1c2b52;
    color: #ffffff;
    border: 2px solid #2f5be0;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  .toggle-btn:hover {
    background-color: #16234a;
  }

  .bio {
    margin-top: 20px;
    font-size: 15px;
    line-height: 1.5;
    color: #444444;

    /* collapsed state */
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
  }

  .bio.open {
    max-height: 200px;
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <path d="M21 15l-5-5L5 21"></path>
      </svg>
    </div>

    <h1 class="name">Sok Dara</h1>
    <p class="role">Information Technology Engineering</p>

    <button class="toggle-btn" id="toggleBtn">Show more</button>

    <p class="bio" id="bio">
      I am a year 3 student at RUPP. I love web development and coffee.
    </p>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const bio = document.getElementById('bio');

    toggleBtn.addEventListener('click', () => {
      const isOpen = bio.classList.toggle('open');
      toggleBtn.textContent = isOpen ? 'Show less' : 'Show more';
    });
  </script>

</body>
</html>
