<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITE Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">ITE Shop</span>
            <div class="text-white">
                Cart <span id="cart-badge" class="badge bg-warning text-dark rounded-pill ms-1">0</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="row">
            
            <!-- Products Grid -->
            <div class="col-md-8">
                <div class="row g-3" id="product-list">
                    <!-- JavaScript will inject products here -->
                </div>
            </div>

            <!-- Shopping Cart -->
            <div class="col-md-4 mt-4 mt-md-0">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white fw-bold">
                        Your Cart
                    </div>
                    <ul class="list-group list-group-flush" id="cart-items">
                        <li class="list-group-item text-muted">Cart is empty</li>
                    </ul>
                    <div class="card-footer bg-light fw-bold">
                        Total: $<span id="cart-total">0.00</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
